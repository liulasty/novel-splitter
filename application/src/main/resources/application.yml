api:
  auth:
    token: ${API_AUTH_TOKEN:}

server:
  port: ${BACKEND_PORT:8080}

# 日志目录；具体分文件由 classpath:logback-spring.xml 配置：
#   novel-splitter-app.log  |  novel-splitter-embed.log  |  novel-splitter-sql.log
# 滚动归档在 ${LOG_PATH:logs}/archive/
logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: INFO
    com.novel.splitter: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

spring:
  datasource:
    # 默认使用 localhost 方便本地开发，在 Docker 中通过环境变量 DB_HOST=postgres 覆盖
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:novel_splitter}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

novel:
  llm:
    provider: ${NOVEL_LLM_PROVIDER:deepseek}

llm:
  coze:
    base-url: ${COZE_BASE_URL:https://api.coze.com}
    api-key: ${COZE_API_KEY}
    bot-id: ${COZE_BOT_ID}
    user-id: ${COZE_USER_ID:user_default}
    # 仅作用于 CozeLlmClient 等远程 Coze API；向量化见 splitter.ingestion.embedding-rate-limit
    rate-limit:
      enabled: true
      max-requests: 2
      duration-seconds: 60
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    rate-limit:
      enabled: true
      max-requests: 3
      duration-seconds: 60
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    rate-limit:
      enabled: true
      max-requests: 15
      duration-seconds: 60
  ollama:
    url: http://localhost:11434
    model: qwen2.5:7b-instruct-q4_K_M
    # 补充适配4060的优化参数（核心）
    options:
      num_ctx: 2048        # 限制上下文窗口，避免显存占用过高
      num_threads: 16      # 适配i5-12600KF的16线程，提升推理速度
      temperature: 0.1     # 降低随机性，缩短响应时间
      max_tokens: 512      # 限制输出长度，减少计算量
      format: json         # 强制JSON输出，匹配你的项目需求
      num_gpu: 1           # 强制使用GPU，避免CPU推理

embedding:
  store:
    type: chroma # memory or chroma
  onnx:
    # 留空以使用 classpath 中的内置模型，或通过环境变量注入外部路径
    model-path: ${EMBEDDING_ONNX_MODEL_PATH:}
    provider: ${EMBEDDING_ONNX_PROVIDER:CPUExecutionProvider}
chroma:
  url: ${CHROMA_URL:http://localhost:8000}
  collection: novel-splitter
  # 与 embedding 模型一致；仅在建 collection 时生效，已存在的 collection 不可原地修改
  hnsw-space: ${CHROMA_HNSW_SPACE:cosine}
  init:
    # 为 true 时：已存在 collection 的 hnsw:space 与 chroma.hnsw-space 不一致则启动失败（需删 collection 或改配置）
    fail-on-distance-mismatch: ${CHROMA_FAIL_ON_DISTANCE_MISMATCH:true}
    # 为 true 时：进程启动即 get_or_create + 校验距离 + 打向量总数（无 Chroma 的测试可设为 false）
    eager: ${CHROMA_INIT_EAGER:true}
  # /delete 对瞬时网络/Chroma 5xx 的重试（与 DB 无法原子，重试可降低「删量成功、后续 DB 失败」概率）
  delete:
    max-attempts: ${CHROMA_DELETE_MAX_ATTEMPTS:4}
    backoff-ms: ${CHROMA_DELETE_BACKOFF_MS:200}

assembler:
  max-chunks: 5
  max-chunk-length: 3000
  max-context-tokens: 12000

splitter:
  storage:
    root-path: ${STORAGE_ROOT_PATH:data/novel-storage}
    raw-dir-name: ${STORAGE_RAW_DIR_NAME:novel-raw}
    parsed-dir-name: ${STORAGE_PARSED_DIR_NAME:novel-parsed}
    raw-filename: ${STORAGE_RAW_FILENAME:original.txt}
  rabbitmq:
    retry:
      max-attempts: 3
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000

  embed:
    # ONNX / Chroma 子批大小（在 scene-listener.batch-size 内再切分）；OOM 时调小，CPU 富余可试 24～32
    sub-batch-size: 16
    # 编排层 fan-out 时每批发送条数（单次 List 传给 TaskQueuePort）
    scene-publish-batch-size: 200
    # 细粒度队列批量监听 batch size（与 RabbitConfig.embedSceneBatchListenerContainerFactory 一致）
    scene-listener:
      batch-size: 50
      # embed.scene 队列「整批」失败时 MQ 监听器重试次数（含首次）。1=不重试，避免不可恢复错误反复跑 ONNX/Chroma。
      listener-max-attempts: 1
    progress-interval-ms: 5000
    progress-scheduler-enabled: true
  
  ingestion:
    batch-size: 10
    chunk-size: 350
    chunk-overlap: 65
    # 向量化（ONNX + Chroma）每「批」调度限流；与 llm.coze.rate-limit 无关。默认关闭。
    embedding-rate-limit:
      enabled: false
      # 每 duration-seconds 窗口内最多处理多少批 embedBatch；0 表示不限制（需 enabled=true 且 >0 才生效）
      max-batches: 0
      duration-seconds: 60

  rule:
    target-length: 350
    min-length: 50
    max-length: 3000
    ignore-empty-lines: true
    
  downloader:
    thread-count: 3
    timeout-ms: 30000
    retry-count: 3
    sites:
      - domain: "www.example.com"
        catalog-url: "https://www.example.com/book/123"
        chapter-list-selector: ".chapter-list a"
        content-selector: "#content"
        next-page-selector: ".next-page"
      - domain: "www.test.com"
        catalog-url: "https://www.test.com/book/456"
        chapter-list-selector: "div.list > a"
        content-selector: "div.read-content"
      - domain: "https://www.xinghuowxw.com"
        catalog-url: "https://www.xinghuowxw.com/book/8T77.html"
        chapter-list-selector: "div.list > a"
        content-selector: "div.read-content"
        next-page-selector: "div.page-nav > a.next"

  rag:
    default-top-k: 5
    min-confidence: 0.5
    max-retries: 2
    output-constraint: "JSON 对象，包含字段：answer, citations (list of {chunkId, reason}), confidence。"
    system-instruction: |
      你是一个专门分析小说内容的智能助手。
      任务：仅根据提供的上下文块回答用户的问题。
      如果上下文中没有答案，请明确说明你不知道。

      *** 重要：输出格式必须是严格的 JSON ***
      不要输出任何 Markdown 标记或代码块。
      不要输出任何多余的解释文字。
      直接返回一个 JSON 对象，Schema 如下：
      {
        "answer": "(string) 这里填写对问题的详细回答",
        "citations": [
          {
            "chunkId": "(string) 引用来源的 chunkId",
            "reason": "(string) 引用理由"
          }
        ],
        "confidence": (number) 0.0 到 1.0
      }

      示例：
      {
        "answer": "楚晨是小说的主角...",
        "citations": [],
        "confidence": 0.9
      }
