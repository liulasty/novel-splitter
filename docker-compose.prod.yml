services:
  rabbitmq:
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"
    volumes:
      - ${DOCKER_DATA_PATH}/rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  chromadb:
    ports:
      - "${CHROMA_PORT}:8000"
    volumes:
      - ${DOCKER_DATA_PATH}/chromadb:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  postgres:
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ${DOCKER_DATA_PATH}/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ${APP_DATA_PATH}/embedding/src/main/resources/embedding:/app/embedding/src/main/resources/embedding
      - ${APP_DATA_PATH}/data/novel-storage:/app/data/novel-storage
      - ${APP_DATA_PATH}/logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    deploy:
      resources:
        limits:
          memory: 256M
