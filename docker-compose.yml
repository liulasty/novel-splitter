services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
    networks:
      - appnet

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: novel-splitter-backend:latest
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # 日志/日期使用北京时间（当前 UTC）
      TZ: Asia/Shanghai
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CHROMA_URL: http://chromadb:${CHROMA_PORT}
      BACKEND_PORT: ${BACKEND_PORT}
      NOVEL_LLM_PROVIDER: ${NOVEL_LLM_PROVIDER:-deepseek}
      COZE_BASE_URL: ${COZE_BASE_URL}
      COZE_API_KEY: ${COZE_API_KEY}
      COZE_BOT_ID: ${COZE_BOT_ID}
      COZE_USER_ID: ${COZE_USER_ID}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN}
      STORAGE_ROOT_PATH: /app/data/novel-storage
      # 重排模型：启用 ONNX bge-reranker-base；默认关闭，需显式开启
      ASSEMBLER_ENABLE_RERANKER: ${ASSEMBLER_ENABLE_RERANKER:-false}
      # 重排模型外部路径（可选），为空时从 classpath 加载
      ASSEMBLER_RERANKER_MODEL_PATH: ${ASSEMBLER_RERANKER_MODEL_PATH:-/app/models/reranker}
      JAVA_OPTS: ${JAVA_OPTS:--Xms1g -Xmx2g -XX:+UseG1GC}
      LOG_PATH: /app/logs
    deploy:
      resources:
        limits:
          cpus: '${BACKEND_CPU_LIMIT:-1.0}'
          memory: ${BACKEND_MEM_LIMIT:-3.5G}
    networks:
      - appnet

  frontend:
    image: novel-splitter-frontend:latest
    container_name: frontend
    build:
      context: ./novel-splitter-web
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:${BACKEND_PORT:-8080}
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
