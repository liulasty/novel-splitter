services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
    networks:
      - appnet

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    networks:
      - appnet
    depends_on:
      - postgres

  backend:
    image: novel-splitter-backend:latest
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CHROMA_URL: http://chromadb:${CHROMA_PORT}
      BACKEND_PORT: ${BACKEND_PORT}
      NOVEL_LLM_PROVIDER: ${NOVEL_LLM_PROVIDER:-deepseek}
      COZE_BASE_URL: ${COZE_BASE_URL}
      COZE_API_KEY: ${COZE_API_KEY}
      COZE_BOT_ID: ${COZE_BOT_ID}
      COZE_USER_ID: ${COZE_USER_ID}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN}
      STORAGE_ROOT_PATH: /app/data/novel-storage
      JAVA_OPTS: ${JAVA_OPTS:--Xmx1g -Xms512m}
      LOG_PATH: /app/logs
    networks:
      - appnet

  frontend:
    image: novel-splitter-frontend:latest
    container_name: frontend
    build:
      context: ./novel-splitter-web
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:${BACKEND_PORT:-8080}
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
